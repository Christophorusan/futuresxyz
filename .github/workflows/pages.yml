name: Verify and deploy Futuresxyz
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_BROWSER_API_KEY }}
          VITE_ALCHEMY_SMART_WALLETS_ENABLED: ${{ vars.ALCHEMY_SMART_WALLETS_ENABLED }}
          VITE_ALCHEMY_GAS_POLICY_ID: ${{ vars.ALCHEMY_GAS_POLICY_ID }}
      - name: Support direct navigation on GitHub Pages
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
